name: CyberPulse Daily Threat Intelligence Pipeline

on:
  schedule:
    # Runs everyday at 06:00 UTC (11:30 AM IST / 02:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual run button from GitHub Actions UI

# Permissions for committing updated data and deploying to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-briefing"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute CTI Ingestion, AI Reasoning & Telegram Broadcast
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}' }}
        run: |
          python backend/generator.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "CyberPulse Bot [GitHub Action]"
          git config --global user.email "action@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update daily threat intel [$(date -u +'%Y-%m-%d')]"
            git push
          fi
